# Nginx site for the restaurant on a server that already runs Nginx for other
# sites. Install:
#
#   sudo cp deploy/nginx/luznarestaurant.com.conf /etc/nginx/sites-available/luznarestaurant.com
#   sudo ln -s /etc/nginx/sites-available/luznarestaurant.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d luznarestaurant.com -d www.luznarestaurant.com
#
# Certbot then adds the HTTPS (443) part and the http → https redirect to this
# file by itself. Paths assume the project is cloned to /var/www/luzna and the
# app listens on 127.0.0.1:3300 (see ecosystem.config.cjs).

upstream luzna_restaurant {
    server 127.0.0.1:3300;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name luznarestaurant.com www.luznarestaurant.com;

    client_max_body_size 64k;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;

    # Hashed build assets never change, so browsers can keep them forever.
    location /_next/static/ {
        alias /var/www/luzna/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    # Images from public/, cached for 30 days.
    location /images/ {
        root /var/www/luzna/public;
        expires 30d;
        add_header X-Content-Type-Options nosniff always;
        access_log off;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://luzna_restaurant;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
